name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests
        working-directory: server
        run: npm test

      - name: Start ephemeral test database
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Run integration tests
        working-directory: server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_USER: root
          DB_PASSWORD: test_root_password
          DB_NAME: taskmanager
        run: npm run test:integration

      - name: Tear down test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  test-client:
    name: Client tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run unit tests
        working-directory: client
        run: npm test

      - name: Build production bundle
        working-directory: client
        run: npm run build

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t appdevops-server:ci ./server

      - name: Build client image
        run: docker build -t appdevops-client:ci ./client

      - name: Build db image
        run: docker build -t appdevops-db:ci ./server/db
