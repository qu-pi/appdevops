---
- name: Configuration serveur AppDevOps
  hosts: app
  become: true

  tasks:
    - name: Mettre à jour le cache APT
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets nécessaires
      apt:
        name:
          - nginx
          - git
        state: present

    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Démarrer Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Ajouter debian au groupe docker
      user:
        name: debian
        groups: docker
        append: true

    - name: Créer le dossier de l'application
      file:
        path: /var/www/appdevops
        state: directory
        owner: debian
        group: debian
        mode: '0755'

    - name: Déployer la configuration Nginx AppDevOps
      template:
        src: templates/web3q3.nginx.conf.j2
        dest: /etc/nginx/sites-available/web3q3
        owner: root
        group: root
        mode: '0644'
      notify: Recharger Nginx

    - name: Activer la configuration Nginx
      file:
        src: /etc/nginx/sites-available/web3q3
        dest: /etc/nginx/sites-enabled/web3q3
        state: link
        force: true

    - name: Vérifier la configuration Nginx
      command: nginx -t
      changed_when: false

  handlers:
    - name: Recharger Nginx
      service:
        name: nginx
        state: reloaded
