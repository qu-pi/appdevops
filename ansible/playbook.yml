---
- name: Configuration serveur AppDevOps
  hosts: app
  become: true

  tasks:
    - name: Mettre à jour le cache APT
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets nécessaires
      apt:
        name:
          - nginx
          - git
        state: present

    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Démarrer Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Ajouter debian au groupe docker
      user:
        name: debian
        groups: docker
        append: true

    - name: Créer le dossier de l'application
      file:
        path: /var/www/appdevops
        state: directory
        owner: debian
        group: debian
        mode: '0755'
    - name: Copier la configuration Nginx
      template:
        src: templates/appdevops.nginx.conf.j2
        dest: /etc/nginx/sites-available/appdevops
        owner: root
        group: root
        mode: '0644'

    - name: Activer le site Nginx
      file:
        src: /etc/nginx/sites-available/appdevops
        dest: /etc/nginx/sites-enabled/appdevops
        state: link
        force: true

    - name: Tester la configuration Nginx
      command: nginx -t
      changed_when: false

    - name: Recharger Nginx
      service:
        name: nginx
        state: reloaded
