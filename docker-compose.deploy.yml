# Single deployment compose file, shared by preprod AND production. Unlike
# docker-compose.yml (which builds images from source for local dev), this
# file only ever pulls pre-built images from GHCR — the server never builds
# anything, it just runs what CI already tested and pushed.
#
# The CD workflow (.github/workflows/cd.yml) copies this exact file to both
# server folders on every deploy, so it's never edited by hand on a server:
#
#   ~/appdevops/preprod/docker-compose.deploy.yml + .env   (project appdevops-preprod)
#   ~/appdevops/prod/docker-compose.deploy.yml    + .env   (project appdevops-prod)
#
#   docker compose -p appdevops-preprod -f docker-compose.deploy.yml --env-file .env pull
#   docker compose -p appdevops-preprod -f docker-compose.deploy.yml --env-file .env up -d
#
#   docker compose -p appdevops-prod    -f docker-compose.deploy.yml --env-file .env pull
#   docker compose -p appdevops-prod    -f docker-compose.deploy.yml --env-file .env up -d
#
# The separate folders are what actually keep the two environments apart, so
# each just has its own plain ".env" — created once by hand on the server and
# never committed (see deploy/.env.deploy.example).
#
# IMAGE_TAG is set by the CD workflow (the git sha it just built) so preprod
# and production always run the exact same, already-tested artifact.

services:
  db:
    image: ghcr.io/${GHCR_OWNER}/appdevops-db:${IMAGE_TAG:-latest}
    restart: always
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-taskmanager}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Bound to loopback only: never expose MySQL on the public interface.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet

  server:
    image: ghcr.io/${GHCR_OWNER}/appdevops-server:${IMAGE_TAG:-latest}
    restart: always
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-taskmanager}
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: the client's nginx reaches this over the internal
      # "appnet" network; this binding is just for local debugging.
      - "127.0.0.1:${SERVER_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - appnet

  client:
    image: ghcr.io/${GHCR_OWNER}/appdevops-client:${IMAGE_TAG:-latest}
    restart: always
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Loopback only: the host's own nginx (with TLS) reverse-proxies to
      # this port; the container itself is never reachable from outside.
      - "127.0.0.1:${CLIENT_PORT:-8080}:80"
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
